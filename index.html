<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Move to NC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
        }

        header {
            background: #16213e;
            padding: 1.5rem 2rem;
            border-bottom: 2px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 { font-size: 1.8rem; color: #e94560; }

        .btn {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-primary { background: #e94560; color: #fff; }
        .btn-primary:hover { background: #c73650; }
        .btn-secondary { background: #533483; color: #fff; }
        .btn-secondary:hover { background: #6b44a0; }
        .btn-danger { background: #c0392b; color: #fff; }
        .btn-danger:hover { background: #a93226; }
        .btn-success { background: #27ae60; color: #fff; }
        .btn-success:hover { background: #219a52; }

        .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background: #16213e;
            border-radius: 10px;
            padding: 2rem;
            width: 95%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h2 { margin-bottom: 1.5rem; color: #e94560; }

        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.4rem; font-weight: 600; color: #ccc; }

        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.95rem;
        }

        .form-group textarea { resize: vertical; min-height: 120px; }
        .form-actions { display: flex; gap: 0.8rem; margin-top: 1.5rem; }

        .list { display: flex; flex-direction: column; gap: 1rem; }

        .card {
            background: #16213e;
            border-radius: 10px;
            padding: 1.5rem;
            border-left: 4px solid #e94560;
            transition: transform 0.15s;
        }

        .card:hover { transform: translateY(-2px); }
        .card .card-date { font-size: 0.8rem; color: #888; margin-bottom: 0.4rem; }
        .card h3 { margin-bottom: 0.5rem; color: #fff; }

        .card .card-mood {
            display: inline-block;
            background: #533483;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .card p { color: #bbb; line-height: 1.5; white-space: pre-wrap; }
        .card .card-actions { margin-top: 1rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }

        .card video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin: 0.8rem 0;
            background: #000;
        }

        .empty-state { text-align: center; padding: 4rem 1rem; color: #666; }
        .empty-state h2 { margin-bottom: 0.5rem; }

        #searchBar {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        #searchBar::placeholder { color: #666; }

        .file-upload-area {
            border: 2px dashed #0f3460;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
        }

        .file-upload-area:hover { border-color: #e94560; }

        .file-upload-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .file-upload-area p { color: #888; margin: 0; }
        .file-upload-area .file-name { color: #e94560; margin-top: 0.5rem; font-size: 0.85rem; }

        .video-preview { margin-top: 0.8rem; }
        .video-preview video { width: 100%; max-height: 300px; border-radius: 8px; background: #000; }

        /* Clip Dump card */
        .dump-card { border-left-color: #0fbb7c; }
        .dump-badge {
            display: inline-block;
            background: #0fbb7c;
            color: #fff;
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-bottom: 0.5rem;
        }
        .dump-clip-count { font-size: 0.8rem; color: #888; }

        .clipdump-area {
            border: 2px dashed #0f3460;
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            position: relative;
            margin: 0.8rem 0;
        }

        .clipdump-area:hover { border-color: #0fbb7c; }

        .clipdump-area input[type="file"] {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .clipdump-area p { color: #888; margin: 0; }
        .clipdump-area .ma-icon { font-size: 1.4rem; margin-bottom: 0.2rem; }

        .clipdump-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .clip-card {
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 8px;
            overflow: hidden;
        }

        .clip-card video {
            width: 100%;
            height: 130px;
            object-fit: cover;
            background: #000;
            display: block;
        }

        .clip-card .clip-info { padding: 0.6rem; }

        .clip-card .clip-name {
            font-size: 0.8rem;
            color: #ddd;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            margin-bottom: 0.3rem;
        }

        .clip-card .clip-date {
            font-size: 0.7rem;
            color: #777;
            margin-bottom: 0.5rem;
        }

        .clip-card .clip-actions { display: flex; gap: 0.4rem; }

        .clip-card .clip-actions .btn {
            padding: 0.4rem 0.7rem;
            font-size: 0.75rem;
            flex: 1;
        }

    </style>
</head>
<body>

    <header>
        <h1>My Move to NC</h1>
        <div style="display:flex; gap:0.6rem; flex-wrap:wrap;">
            <a class="btn btn-success" href="https://www.capcut.com/my-edit?start_tab=video" target="_blank" rel="noopener">Edit in CapCut</a>
            <button class="btn btn-secondary" onclick="openDumpModal()">+ New Clip Dump</button>
            <button class="btn btn-primary" onclick="openModal()">+ New Entry</button>
        </div>
    </header>

    <div class="container">
        <input type="text" id="searchBar" placeholder="Search entries &amp; clip dumps..." oninput="renderAll()">
        <div id="list" class="list"></div>
    </div>

    <!-- Create/Edit Vlog Modal -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <h2 id="modalTitle">New Vlog Entry</h2>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" placeholder="What happened today on the move?" required>
            </div>
            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood" required>
                    <option value="">Select mood...</option>
                    <option value="Happy">&#128522; Happy</option>
                    <option value="Sad">&#128546; Sad</option>
                    <option value="Excited">&#129321; Excited</option>
                    <option value="Tired">&#128564; Tired</option>
                    <option value="Angry">&#128545; Angry</option>
                    <option value="Grateful">&#128591; Grateful</option>
                    <option value="Chill">&#128524; Chill</option>
                    <option value="Motivated">&#128170; Motivated</option>
                </select>
            </div>
            <div class="form-group">
                <label>Video (optional)</label>
                <div class="file-upload-area" id="fileUploadArea">
                    <p>Click or drag a video file here</p>
                    <div class="file-name" id="fileName"></div>
                    <input type="file" id="videoFile" accept="video/*" onchange="handleFileSelect(event)">
                </div>
                <div class="video-preview" id="videoPreview"></div>
            </div>
            <div class="form-group">
                <label for="content">Description</label>
                <textarea id="content" placeholder="Write about your move to NC or what's happening..." required></textarea>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="saveVlog()">Save</button>
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Create Clip Dump Modal -->
    <div class="modal-overlay" id="dumpModal">
        <div class="modal">
            <h2>New Clip Dump</h2>
            <div class="form-group">
                <label for="dumpTitle">Name</label>
                <input type="text" id="dumpTitle" placeholder="e.g. Trailer park clips, House hunting b-roll..." required>
            </div>
            <div class="form-group">
                <label>Clips</label>
                <div class="file-upload-area" id="dumpFileArea">
                    <p>Click or drag video files here (select multiple)</p>
                    <div class="file-name" id="dumpFileName"></div>
                    <input type="file" id="dumpFiles" accept="video/*" multiple onchange="handleDumpModalFiles(event)" required>
                </div>
            </div>
            <p style="color:#888; font-size:0.85rem; margin-bottom:1rem;">A clip dump is a post you can add clips to over time. Later you'll download all its clips to edit in CapCut on your laptop.</p>
            <div class="form-actions">
                <button class="btn btn-primary" onclick="createDump()">Create</button>
                <button class="btn btn-secondary" onclick="closeDumpModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'VlogDB';
        const DB_VERSION = 2;
        const STORE_NAME = 'videos';
        const CLIP_STORE = 'clips';
        let db = null;
        let vlogs = JSON.parse(localStorage.getItem('vlogs') || '[]');
        let clipDumps = JSON.parse(localStorage.getItem('clipDumps') || '[]');
        let clipUrls = {};
        let dumpModalFiles = [];
        let currentVideoBlob = null;
        let currentEditVideoKey = null;
        let currentVideoFileName = null;
        let videoObjectUrls = {};

        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME);
                    if (!db.objectStoreNames.contains(CLIP_STORE)) db.createObjectStore(CLIP_STORE);
                };
                request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                request.onerror = (e) => reject(e);
            });
        }

        function saveVideoBlob(key, blob) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(blob, key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        function getVideoBlob(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }

        function deleteVideoBlob(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        /* Clip blob helpers (stored by full key = dumpId + '::' + clipId) */
        function saveClipBlob(key, blob) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CLIP_STORE, 'readwrite');
                tx.objectStore(CLIP_STORE).put(blob, key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        function getClipBlob(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CLIP_STORE, 'readonly');
                const req = tx.objectStore(CLIP_STORE).get(key);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }

        function deleteClipBlob(key) {
            return new Promise((resolve, reject) => {
                const tx = db.transaction(CLIP_STORE, 'readwrite');
                tx.objectStore(CLIP_STORE).delete(key);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        /* ===== CLIP DUMP MODAL ===== */
        function openDumpModal() {
            document.getElementById('dumpModal').classList.add('active');
            document.getElementById('dumpTitle').value = '';
            document.getElementById('dumpFiles').value = '';
            document.getElementById('dumpFileName').textContent = '';
            dumpModalFiles = [];
        }

        function closeDumpModal() { document.getElementById('dumpModal').classList.remove('active'); }

        function handleDumpModalFiles(event) {
            const files = Array.from(event.target.files || []);
            dumpModalFiles = files.filter(f => f && f.type.indexOf('video') !== -1);
            document.getElementById('dumpFileName').textContent = dumpModalFiles.length
                ? dumpModalFiles.length + ' clip(s): ' + dumpModalFiles.map(f => f.name).join(', ')
                : '';
        }

        async function createDump() {
            const title = document.getElementById('dumpTitle').value.trim();
            if (!title) { alert('Please give this clip dump a name.'); return; }
            if (dumpModalFiles.length === 0) { alert('Please add at least one clip before creating the dump.'); return; }
            const dump = { id: 'dump_' + Date.now(), title, createdAt: new Date().toISOString(), clips: [] };
            for (const file of dumpModalFiles) {
                const clipId = 'clip_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                const key = dump.id + '::' + clipId;
                try {
                    await saveClipBlob(key, file);
                    dump.clips.unshift({ id: clipId, key, name: file.name, size: file.size, date: new Date().toISOString() });
                } catch (err) {
                    console.error('Failed to save clip', file.name, err);
                }
            }
            clipDumps.unshift(dump);
            localStorage.setItem('clipDumps', JSON.stringify(clipDumps));
            closeDumpModal();
            renderAll();
            if (dump.clips.length > 0) alert('Created "' + dump.title + '" with ' + dump.clips.length + ' clip(s).');
        }

        /* ===== CLIP DUMP HELPERS ===== */
        function getDump(id) { return clipDumps.find(d => d.id === id); }

        async function handleDumpFiles(dumpId, files) {
            if (!files || files.length === 0) return;
            const dump = getDump(dumpId);
            if (!dump) return;
            const added = [];
            for (const file of files) {
                if (!file || file.type.indexOf('video') === -1) continue;
                const clipId = 'clip_' + Date.now() + '_' + Math.floor(Math.random() * 10000);
                const key = dumpId + '::' + clipId;
                try {
                    await saveClipBlob(key, file);
                    dump.clips.unshift({ id: clipId, key, name: file.name, size: file.size, date: new Date().toISOString() });
                    added.push(file.name);
                } catch (err) {
                    console.error('Failed to save clip', file.name, err);
                }
            }
            localStorage.setItem('clipDumps', JSON.stringify(clipDumps));
            renderAll();
            if (added.length > 0) alert('Added ' + added.length + ' clip(s) to "' + dump.title + '".');
        }

        async function downloadDumpAll(dumpId) {
            const dump = getDump(dumpId);
            if (!dump || dump.clips.length === 0) { alert('This dump has no clips yet.'); return; }
            for (const clip of dump.clips) {
                const blob = await getClipBlob(clip.key);
                if (blob) downloadBlob(blob, clip.name);
            }
            alert('Downloaded ' + dump.clips.length + ' clip(s) to your Downloads folder. Now open CapCut and upload them.');
        }

        async function downloadClip(dumpId, clipId) {
            const dump = getDump(dumpId);
            if (!dump) return;
            const clip = dump.clips.find(c => c.id === clipId);
            if (!clip) return;
            const blob = await getClipBlob(clip.key);
            if (!blob) { alert('Clip not found.'); return; }
            downloadBlob(blob, clip.name);
        }

        async function deleteClip(dumpId, clipId) {
            if (!confirm('Delete this clip from the dump?')) return;
            const dump = getDump(dumpId);
            if (!dump) return;
            const clip = dump.clips.find(c => c.id === clipId);
            if (clip) {
                await deleteClipBlob(clip.key);
                const urlKey = dumpId + '::' + clipId;
                if (clipUrls[urlKey]) { URL.revokeObjectURL(clipUrls[urlKey]); delete clipUrls[urlKey]; }
                dump.clips = dump.clips.filter(c => c.id !== clipId);
                localStorage.setItem('clipDumps', JSON.stringify(clipDumps));
                renderAll();
            }
        }

        async function deleteDump(dumpId) {
            if (!confirm('Delete this clip dump and all its clips?')) return;
            const dump = getDump(dumpId);
            if (dump) {
                for (const clip of dump.clips) await deleteClipBlob(clip.key);
                clipDumps = clipDumps.filter(d => d.id !== dumpId);
                localStorage.setItem('clipDumps', JSON.stringify(clipDumps));
                renderAll();
            }
        }

        function dumpCardHtml(dump) {
            const count = dump.clips.length;
            let clipsHtml = '';
            for (const clip of dump.clips.slice(0, 12)) {
                const urlKey = dump.id + '::' + clip.id;
                const sizeMB = (clip.size / 1024 / 1024).toFixed(1);
                clipsHtml += `
                    <div class="clip-card">
                        <video src="" muted preload="metadata" data-urlkey="${urlKey}"></video>
                        <div class="clip-info">
                            <div class="clip-name" title="${escapeHtml(clip.name)}">${escapeHtml(clip.name)}</div>
                            <div class="clip-date">${formatDate(clip.date)} &middot; ${sizeMB} MB</div>
                            <div class="clip-actions">
                                <button class="btn btn-secondary" onclick="downloadClip('${dump.id}','${clip.id}')">Download</button>
                                <button class="btn btn-danger" onclick="deleteClip('${dump.id}','${clip.id}')">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="card dump-card">
                    <div class="card-date">${formatDate(dump.createdAt)}</div>
                    <h3>&#127909; ${escapeHtml(dump.title)}</h3>
                    <span class="dump-badge">Clip Dump</span>
                    <span class="dump-clip-count">${count} clip${count === 1 ? '' : 's'}</span>
                    <div class="card-actions">
                        <button class="btn btn-success" onclick="downloadDumpAll('${dump.id}')">Download All</button>
                        <a class="btn btn-secondary" href="https://www.capcut.com/my-edit?start_tab=video" target="_blank" rel="noopener">Edit in CapCut</a>
                        <button class="btn btn-danger" onclick="deleteDump('${dump.id}')">Delete Whole Dump Set</button>
                    </div>
                    <div class="clipdump-area" data-dump="${dump.id}">
                        <div class="ma-icon">&#127916;</div>
                        <p>Click or drop to add clips (select multiple)</p>
                        <input type="file" accept="video/*" multiple onchange="handleDumpFilesFromInput(event, '${dump.id}')">
                    </div>
                    ${count === 0 ? `<p style="color:#666; font-size:0.85rem; text-align:center; padding:0.5rem 0;">No clips in this dump yet. Add some above!</p>` : ''}
                    <div class="clipdump-grid">${clipsHtml}</div>
                </div>
            `;
        }

        function handleDumpFilesFromInput(event, dumpId) {
            const files = Array.from(event.target.files || []);
            event.target.value = '';
            handleDumpFiles(dumpId, files);
        }

        function renderClipPreviews(root) {
            root.querySelectorAll('.clip-card video[data-urlkey]').forEach(video => {
                const urlKey = video.getAttribute('data-urlkey');
                if (!clipUrls[urlKey]) {
                    getClipBlob(urlKey).then(blob => {
                        if (blob) {
                            clipUrls[urlKey] = URL.createObjectURL(blob);
                            video.src = clipUrls[urlKey];
                        }
                    });
                } else {
                    video.src = clipUrls[urlKey];
                }
            });
        }

        function downloadBlob(blob, name) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 3000);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('fileName').textContent = file.name;
            currentVideoBlob = file;
            currentEditVideoKey = null;
            currentVideoFileName = file.name;
            const url = URL.createObjectURL(file);
            document.getElementById('videoPreview').innerHTML = `<video src="${url}" controls></video>`;
        }

        function openModal(id) {
            document.getElementById('modal').classList.add('active');
            currentVideoBlob = null;
            currentEditVideoKey = null;
            currentVideoFileName = null;
            document.getElementById('fileName').textContent = '';
            document.getElementById('videoPreview').innerHTML = '';
            document.getElementById('videoFile').value = '';

            if (id) {
                const vlog = vlogs.find(v => v.id === id);
                document.getElementById('modalTitle').textContent = 'Edit Vlog Entry';
                document.getElementById('editId').value = id;
                document.getElementById('title').value = vlog.title;
                document.getElementById('mood').value = vlog.mood;
                document.getElementById('content').value = vlog.content;
                if (vlog.videoKey) {
                    currentEditVideoKey = vlog.videoKey;
                    document.getElementById('fileName').textContent = vlog.videoFileName || 'Current video';
                    getVideoBlob(vlog.videoKey).then(blob => {
                        if (blob) {
                            currentVideoBlob = blob;
                            const url = URL.createObjectURL(blob);
                            document.getElementById('videoPreview').innerHTML = `<video src="${url}" controls></video>`;
                        }
                    });
                }
            } else {
                document.getElementById('modalTitle').textContent = 'New Vlog Entry';
                document.getElementById('editId').value = '';
                document.getElementById('title').value = '';
                document.getElementById('mood').value = '';
                document.getElementById('content').value = '';
            }
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        async function saveVlog() {
            const title = document.getElementById('title').value.trim();
            const mood = document.getElementById('mood').value;
            const content = document.getElementById('content').value.trim();
            const editId = document.getElementById('editId').value;

            const videoFile = document.getElementById('videoFile').files[0];
            if (videoFile && !currentEditVideoKey) {
                currentVideoBlob = videoFile;
                currentVideoFileName = videoFile.name;
            }
            const hasEditedVideo = currentVideoBlob && !currentEditVideoKey && currentVideoFileName;

            if (!title) { alert('Please add a title.'); return; }
            if (!mood) { alert('Please select a mood.'); return; }
            if (!content) { alert('Please add a description.'); return; }

            if (editId) {
                const index = vlogs.findIndex(v => v.id === editId);
                const existing = vlogs[index];

                if (hasEditedVideo) {
                    if (existing.videoKey) await deleteVideoBlob(existing.videoKey);
                    const videoKey = 'video_' + editId + '_' + Date.now();
                    await saveVideoBlob(videoKey, currentVideoBlob);
                    vlogs[index] = { ...existing, title: title || existing.title, mood, content, videoKey, videoFileName: currentVideoFileName, updatedAt: new Date().toISOString() };
                } else if (currentVideoBlob && currentEditVideoKey) {
                    vlogs[index] = { ...existing, title: title || existing.title, mood, content, updatedAt: new Date().toISOString() };
                } else {
                    if (existing.videoKey) await deleteVideoBlob(existing.videoKey);
                    vlogs[index] = { ...existing, title: title || existing.title, mood, content, videoKey: null, videoFileName: null, updatedAt: new Date().toISOString() };
                }
            } else {
                const id = Date.now().toString();
                let videoKey = null, videoFileName = null;
                if (currentVideoBlob && currentVideoFileName) {
                    videoKey = 'video_' + id + '_' + Date.now();
                    videoFileName = currentVideoFileName;
                    await saveVideoBlob(videoKey, currentVideoBlob);
                }
                vlogs.unshift({ id, title: title || 'Untitled', mood, content, videoKey, videoFileName, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
            }

            localStorage.setItem('vlogs', JSON.stringify(vlogs));
            closeModal();
            renderAll();
        }

        async function deleteVlog(id) {
            if (confirm('Delete this vlog entry?')) {
                const vlog = vlogs.find(v => v.id === id);
                if (vlog && vlog.videoKey) await deleteVideoBlob(vlog.videoKey);
                vlogs = vlogs.filter(v => v.id !== id);
                localStorage.setItem('vlogs', JSON.stringify(vlogs));
                renderAll();
            }
        }

        function formatDate(iso) {
            return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return m + ':' + String(s).padStart(2, '0');
        }

        function vlogCardHtml(v) {
            let videoHtml = '';
            if (v.videoKey) {
                if (!videoObjectUrls[v.videoKey]) {
                    videoHtml = `<video src="" muted preload="metadata" data-videokey="${v.videoKey}"></video>`;
                } else {
                    videoHtml = `<video src="${videoObjectUrls[v.videoKey]}" controls preload="metadata"></video>`;
                }
            }

            const editVideoBtn = v.videoKey ? `<a class="btn btn-success" href="https://www.capcut.com/my-edit?start_tab=video" target="_blank" rel="noopener">Edit in CapCut</a>` : '';

            return `
                <div class="card">
                    <div class="card-date">${formatDate(v.createdAt)}${v.updatedAt !== v.createdAt ? ' (edited)' : ''}</div>
                    <h3>${escapeHtml(v.title)}</h3>
                    ${v.mood ? `<span class="card-mood">${v.mood}</span>` : ''}
                    ${videoHtml}
                    <p>${escapeHtml(v.content)}</p>
                    <div class="card-actions">
                        <button class="btn btn-secondary" onclick="openModal('${v.id}')">Edit</button>
                        ${editVideoBtn}
                        <button class="btn btn-danger" onclick="deleteVlog('${v.id}')">Delete</button>
                    </div>
                </div>
            `;
        }

        function renderVideoPreviews(root) {
            root.querySelectorAll('video[data-videokey]').forEach(video => {
                const key = video.getAttribute('data-videokey');
                if (!videoObjectUrls[key]) {
                    getVideoBlob(key).then(blob => {
                        if (blob) {
                            videoObjectUrls[key] = URL.createObjectURL(blob);
                            video.src = videoObjectUrls[key];
                            video.setAttribute('controls', '');
                        }
                    });
                }
            });
        }

        function renderAll() {
            const query = document.getElementById('searchBar').value.toLowerCase();
            const container = document.getElementById('list');

            const items = [];
            for (const v of vlogs) {
                const hay = (v.title + ' ' + (v.content || '') + ' ' + (v.mood || '')).toLowerCase();
                if (!query || hay.includes(query)) items.push({ type: 'vlog', item: v, date: new Date(v.createdAt) });
            }
            for (const d of clipDumps) {
                const hay = (d.title + ' ' + d.clips.map(c => c.name).join(' ')).toLowerCase();
                if (!query || hay.includes(query)) items.push({ type: 'dump', item: d, date: new Date(d.createdAt) });
            }
            items.sort((a, b) => b.date - a.date);

            if (items.length === 0) {
                const msg = (vlogs.length === 0 && clipDumps.length === 0)
                    ? 'Click "+ New Entry" or "+ New Clip Dump" to start documenting your move to NC!'
                    : 'Try a different search.';
                container.innerHTML = `<div class="empty-state"><h2>${query ? 'No results found' : 'Nothing here yet'}</h2><p>${msg}</p></div>`;
                return;
            }

            let html = '';
            for (const it of items) {
                html += it.type === 'vlog' ? vlogCardHtml(it.item) : dumpCardHtml(it.item);
            }
            container.innerHTML = html;
            renderVideoPreviews(container);
            renderClipPreviews(container);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('dumpModal').addEventListener('click', function(e) {
            if (e.target === this) closeDumpModal();
        });

        // Drag-and-drop onto each dump's clip area
        document.addEventListener('dragover', (e) => {
            const area = e.target.closest && (e.target.closest('.clipdump-area') || e.target.closest('#dumpFileArea'));
            if (area) { e.preventDefault(); area.style.borderColor = '#e94560'; }
        });
        document.addEventListener('dragleave', (e) => {
            const area = e.target.closest && (e.target.closest('.clipdump-area') || e.target.closest('#dumpFileArea'));
            if (area) { area.style.borderColor = area.classList.contains('clipdump-area') ? '#0f3460' : '#0f3460'; }
        });
        document.addEventListener('drop', (e) => {
            const dumpArea = e.target.closest && e.target.closest('.clipdump-area');
            if (dumpArea) {
                e.preventDefault();
                dumpArea.style.borderColor = '#0f3460';
                const dumpId = dumpArea.getAttribute('data-dump');
                handleDumpFiles(dumpId, Array.from(e.dataTransfer.files));
                return;
            }
            const modalArea = e.target.closest && e.target.closest('#dumpFileArea');
            if (modalArea) {
                e.preventDefault();
                modalArea.style.borderColor = '#0f3460';
                const files = Array.from(e.dataTransfer.files).filter(f => f && f.type.indexOf('video') !== -1);
                dumpModalFiles = dumpModalFiles.concat(files);
                document.getElementById('dumpFileName').textContent = dumpModalFiles.length
                    ? dumpModalFiles.length + ' clip(s): ' + dumpModalFiles.map(f => f.name).join(', ')
                    : '';
            }
        });

        openDB().then(() => {
            renderAll();
        });
    </script>
</body>
</html>
